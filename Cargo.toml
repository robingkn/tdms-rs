[package]
name = "tdms-rs"
version = "1.0.0"
edition = "2021"
description = "Pure Rust TDMS file parser for National Instruments TDMS files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robingkn/tdms-rs"
homepage = "https://github.com/robingkn/tdms-rs"
keywords = ["tdms", "labview", "parser", "data", "national-instruments"]
categories = ["parsing", "science"]
readme = "README.md"

[[bin]]
name = "tdms-to-json"
path = "src/bin/tdms_to_json.rs"

[dependencies]
byteorder = "1.4"
ordered-float = "5.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
