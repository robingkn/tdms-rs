[package]
name = "tdms-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.70.0"
authors = ["Robin George Koshy <robingkn@users.noreply.github.com>"]
description = "Pure Rust library for reading and writing National Instruments TDMS files with full format support and ergonomic APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robingkn/tdms-rs"
homepage = "https://github.com/robingkn/tdms-rs"
documentation = "https://docs.rs/tdms-rs"
keywords = ["tdms", "labview", "parser", "data", "national-instruments"]
categories = ["parsing", "science", "data-structures"]
readme = "README.md"
exclude = [
    "tests/fixtures/",
    "tests/output/",
    "examples/output/",
    "tools/",
    "target/",
    ".git/",
    "*.md",
    "!README.md",
    "!CHANGELOG.md"
]

# Temporarily disabled during API redesign
# [[bin]]
# name = "tdms-to-json"
# path = "src/bin/tdms_to_json.rs"

# [[bin]]
# name = "benchmark"
# path = "benchmark/tdms_rs/benchmark.rs"

# [[bin]]
# name = "rust_loading"
# path = "benchmark/loading/rust_loading.rs"

[dependencies]
byteorder = "1.4"
ordered-float = "5.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
indexmap = "1.9"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
