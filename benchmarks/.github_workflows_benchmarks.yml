# GitHub Actions workflow for nptdms benchmarks
# 
# This file should be placed at: .github/workflows/benchmarks.yml
# in your repository root to enable automated benchmark runs.

name: nptdms Benchmarks

on:
  # Run on pushes to main branch
  push:
    branches: [ main, master ]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  
  # Run on pull requests
  pull_request:
    branches: [ main, master ]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
  
  # Run weekly for trend analysis
  schedule:
    - cron: '0 2 * * 0'  # Sunday at 2 AM UTC

jobs:
  smoke-tests:
    name: Smoke Tests (Quick)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('benchmarks/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd benchmarks
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run setup validation
      run: |
        cd benchmarks
        python setup_benchmarks.py
    
    - name: Run smoke benchmarks
      run: |
        cd benchmarks
        python run_benchmarks.py --mode smoke --format both
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: smoke-results-py${{ matrix.python-version }}
        path: benchmarks/results/
        retention-days: 30
    
    - name: Check for performance regressions
      run: |
        cd benchmarks
        python -c "
        import json
        from pathlib import Path
        
        # Find the latest results file
        results_dir = Path('results')
        json_files = list(results_dir.glob('*smoke*.json'))
        
        if json_files:
            latest_file = max(json_files, key=lambda p: p.stat().st_mtime)
            with open(latest_file) as f:
                data = json.load(f)
            
            # Simple regression check - fail if any operation takes > 10 seconds
            slow_operations = [
                r for r in data['results'] 
                if r['time_sec'] > 10.0
            ]
            
            if slow_operations:
                print('❌ Performance regression detected:')
                for op in slow_operations:
                    print(f'  {op[\"benchmark_name\"]}: {op[\"time_sec\"]:.2f}s')
                exit(1)
            else:
                print('✅ No performance regressions detected')
        else:
            print('⚠️  No results files found')
        "

  full-benchmarks:
    name: Full Benchmarks (Comprehensive)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd benchmarks
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run full benchmarks
      run: |
        cd benchmarks
        python run_benchmarks.py --mode full --format both
    
    - name: Upload comprehensive results
      uses: actions/upload-artifact@v3
      with:
        name: full-benchmark-results
        path: benchmarks/results/
        retention-days: 90
    
    - name: Generate performance report
      run: |
        cd benchmarks
        python -c "
        import json
        import csv
        from pathlib import Path
        
        # Find the latest results
        results_dir = Path('results')
        json_files = list(results_dir.glob('*full*.json'))
        
        if json_files:
            latest_file = max(json_files, key=lambda p: p.stat().st_mtime)
            with open(latest_file) as f:
                data = json.load(f)
            
            # Generate summary report
            results = data['results']
            
            print('# nptdms Benchmark Report')
            print(f'Generated: {data[\"timestamp\"]}')
            print(f'Total tests: {len(results)}')
            print()
            
            # Group by category
            categories = {}
            for r in results:
                cat = r['benchmark_name'].split('_')[0]
                if cat not in categories:
                    categories[cat] = []
                categories[cat].append(r)
            
            for category, cat_results in categories.items():
                print(f'## {category.upper()} Benchmarks')
                print(f'Tests: {len(cat_results)}')
                
                # Calculate averages
                avg_time = sum(r['time_sec'] for r in cat_results) / len(cat_results)
                throughputs = [r['mb_per_sec'] for r in cat_results if r['mb_per_sec'] > 0]
                avg_throughput = sum(throughputs) / len(throughputs) if throughputs else 0
                
                print(f'Average time: {avg_time:.3f}s')
                if avg_throughput > 0:
                    print(f'Average throughput: {avg_throughput:.1f} MB/s')
                
                # Show top 3 slowest
                slowest = sorted(cat_results, key=lambda r: r['time_sec'], reverse=True)[:3]
                print('Slowest operations:')
                for r in slowest:
                    print(f'  - {r[\"operation\"]}: {r[\"time_sec\"]:.3f}s')
                print()
        " > benchmarks/results/performance_report.md
    
    - name: Upload performance report
      uses: actions/upload-artifact@v3
      with:
        name: performance-report
        path: benchmarks/results/performance_report.md
        retention-days: 90

  compare-with-baseline:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for comparison
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd benchmarks
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download current results
      uses: actions/download-artifact@v3
      with:
        name: smoke-results-py3.11
        path: benchmarks/results/current/
    
    - name: Run baseline benchmarks
      run: |
        # Checkout main branch
        git checkout main
        cd benchmarks
        python run_benchmarks.py --mode smoke --format json
        mkdir -p results/baseline/
        mv results/*smoke*.json results/baseline/
    
    - name: Compare performance
      run: |
        cd benchmarks
        python -c "
        import json
        from pathlib import Path
        
        # Load baseline and current results
        baseline_files = list(Path('results/baseline/').glob('*.json'))
        current_files = list(Path('results/current/').glob('*.json'))
        
        if baseline_files and current_files:
            with open(baseline_files[0]) as f:
                baseline = json.load(f)
            with open(current_files[0]) as f:
                current = json.load(f)
            
            # Compare results
            print('# Performance Comparison')
            print('| Operation | Baseline (s) | Current (s) | Change |')
            print('|-----------|--------------|-------------|--------|')
            
            baseline_ops = {r['operation']: r['time_sec'] for r in baseline['results']}
            
            regressions = []
            improvements = []
            
            for r in current['results']:
                op = r['operation']
                current_time = r['time_sec']
                
                if op in baseline_ops:
                    baseline_time = baseline_ops[op]
                    change = ((current_time - baseline_time) / baseline_time) * 100
                    
                    if abs(change) > 5:  # Only show significant changes
                        status = '🔴' if change > 0 else '🟢'
                        print(f'| {op} | {baseline_time:.3f} | {current_time:.3f} | {status} {change:+.1f}% |')
                        
                        if change > 10:  # Regression threshold
                            regressions.append((op, change))
                        elif change < -10:  # Improvement threshold
                            improvements.append((op, change))
            
            if regressions:
                print()
                print('⚠️ Performance regressions detected:')
                for op, change in regressions:
                    print(f'  - {op}: {change:+.1f}%')
                exit(1)
            elif improvements:
                print()
                print('🎉 Performance improvements detected:')
                for op, change in improvements:
                    print(f'  - {op}: {change:+.1f}%')
        " > performance_comparison.md
    
    - name: Comment PR with results
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'performance_comparison.md';
          
          if (fs.existsSync(path)) {
            const body = fs.readFileSync(path, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Benchmark Results\n\n${body}`
            });
          }