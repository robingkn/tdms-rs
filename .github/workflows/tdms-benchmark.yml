name: TDMS Benchmark

# Manual trigger only
on:
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: windows-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Python dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Setup Rust
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      # Install DiskSpd if missing
      - name: Install DiskSpd
        shell: powershell
        run: |
          if (!(Get-Command diskspd.exe -ErrorAction SilentlyContinue)) {
            Write-Host "DiskSpd not found. Downloading..."
            Invoke-WebRequest -Uri "https://github.com/Microsoft/diskspd/releases/latest/download/DiskSpd.zip" -OutFile "DiskSpd.zip"
            Expand-Archive -Path "DiskSpd.zip" -DestinationPath "DiskSpd"
            $diskspd_dir = Join-Path (Get-Location).Path "DiskSpd\amd64"
            Add-Content -Path $env:GITHUB_PATH -Value $diskspd_dir
            Write-Host "DiskSpd installed to $diskspd_dir and added to PATH."
          } else {
            Write-Host "DiskSpd is already available."
          }

      # Run the benchmark
      - name: Run TDMS Benchmark
        run: |
          python benchmark/run.py

      # Render summary in GHA UI
      - name: Render Summary in GitHub Actions UI
        shell: bash
        run: |
          cat benchmark/results/summary.md >> $GITHUB_STEP_SUMMARY

      # Upload reports as artifact
      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: tdms-benchmark-reports
          path: |
            benchmark/results/results.json
            benchmark/results/summary.md
